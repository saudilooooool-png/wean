version: "3.9"

services:
  # ─── PostgreSQL (shared by n8n + Appwrite) ─────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: wean_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wean_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wean}
      # Extra database for n8n
      POSTGRES_NON_ROOT_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_NON_ROOT_PASSWORD: ${N8N_DB_PASSWORD:-n8n_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - wean_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wean}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (session cache + queues) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wean_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wean_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Evolution API (WhatsApp Gateway) ──────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: wean_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_api_key_change_me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-wean}:${POSTGRES_PASSWORD:-wean_secret}@postgres:5432/${POSTGRES_DB:-wean}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_client
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/whatsapp}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wean_network

  # ─── n8n (Workflow Automation) ──────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.40.0
    container_name: wean_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_secret}
      # n8n core
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_32_chars_minimum_length}
      EXECUTIONS_PROCESS: main
      EXECUTIONS_TIMEOUT: 300
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: last
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      # Queue via Redis
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      QUEUE_BULL_REDIS_DB: 2
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin_secret}
      # Misc
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Riyadh}
      TZ: ${TIMEZONE:-Asia/Riyadh}
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wean_network

  # ─── LangChain / FastAPI Service ───────────────────────────────────────────
  langchain-service:
    build:
      context: ./langchain-service
      dockerfile: Dockerfile
    container_name: wean_langchain
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/3
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-http://appwrite:80/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wean_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Appwrite (Database + Auth) ─────────────────────────────────────────────
  appwrite:
    image: appwrite/appwrite:1.5.7
    container_name: wean_appwrite
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      _APP_ENV: production
      _APP_LOCALE: ar
      _APP_CONSOLE_WHITELIST_ROOT: enabled
      _APP_CONSOLE_WHITELIST_EMAILS: ${APPWRITE_ADMIN_EMAIL:-admin@wean.local}
      _APP_OPENSSL_KEY_V1: ${APPWRITE_OPENSSL_KEY:-your_openssl_key_change_me}
      _APP_DOMAIN: ${APPWRITE_DOMAIN:-localhost}
      _APP_DOMAIN_TARGET: ${APPWRITE_DOMAIN:-localhost}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_REDIS_USER: ""
      _APP_REDIS_PASS: ${REDIS_PASSWORD:-redis_secret}
      _APP_DB_HOST: postgres
      _APP_DB_PORT: 5432
      _APP_DB_SCHEMA: appwrite
      _APP_DB_USER: ${POSTGRES_USER:-wean}
      _APP_DB_PASS: ${POSTGRES_PASSWORD:-wean_secret}
      _APP_STORAGE_LIMIT: 30000000
      _APP_FUNCTIONS_SIZE_LIMIT: 30000000
      _APP_USAGE_STATS: enabled
      _APP_LOGGING_PROVIDER: ""
    volumes:
      - appwrite_uploads:/storage/uploads
      - appwrite_cache:/storage/cache
      - appwrite_config:/storage/config
      - appwrite_certificates:/storage/certificates
      - appwrite_functions:/storage/functions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wean_network

  appwrite-worker-audits:
    image: appwrite/appwrite:1.5.7
    container_name: wean_appwrite_worker_audits
    restart: unless-stopped
    entrypoint: worker-audits
    environment:
      _APP_ENV: production
      _APP_OPENSSL_KEY_V1: ${APPWRITE_OPENSSL_KEY:-your_openssl_key_change_me}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_REDIS_PASS: ${REDIS_PASSWORD:-redis_secret}
      _APP_DB_HOST: postgres
      _APP_DB_PORT: 5432
      _APP_DB_SCHEMA: appwrite
      _APP_DB_USER: ${POSTGRES_USER:-wean}
      _APP_DB_PASS: ${POSTGRES_PASSWORD:-wean_secret}
    depends_on:
      - appwrite
    networks:
      - wean_network

  # ─── Cache Worker — يجدد كاش الأماكن كل 12 ساعة ───────────────────────────
  cache-worker:
    build:
      context: ./langchain-service
    container_name: wean_cache_worker
    command: python cache_worker.py
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/3
      OVERPASS_URL: https://overpass-api.de/api/interpreter
      API_BASE_URL: http://langchain-service:8000
      CACHE_REFRESH_HOURS: "12"
      CACHE_DELAY_SECONDS: "2.5"
    depends_on:
      - redis
      - langchain-service
    restart: unless-stopped
    networks:
      - wean_network

  # ─── Admin Dashboard (Static HTML + Nginx) ────────────────────────────────
  admin:
    build: ./admin
    container_name: wean_admin
    ports:
      - "3000:80"
    depends_on:
      - langchain-service
    restart: unless-stopped
    networks:
      - wean_network

  appwrite-worker-deletes:
    image: appwrite/appwrite:1.5.7
    container_name: wean_appwrite_worker_deletes
    restart: unless-stopped
    entrypoint: worker-deletes
    environment:
      _APP_ENV: production
      _APP_OPENSSL_KEY_V1: ${APPWRITE_OPENSSL_KEY:-your_openssl_key_change_me}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_REDIS_PASS: ${REDIS_PASSWORD:-redis_secret}
      _APP_DB_HOST: postgres
      _APP_DB_PORT: 5432
      _APP_DB_SCHEMA: appwrite
      _APP_DB_USER: ${POSTGRES_USER:-wean}
      _APP_DB_PASS: ${POSTGRES_PASSWORD:-wean_secret}
      _APP_STORAGE_DEVICE: local
      _APP_STORAGE_S3_ACCESS_KEY: ""
      _APP_STORAGE_S3_SECRET: ""
      _APP_STORAGE_S3_REGION: ""
      _APP_STORAGE_S3_BUCKET: ""
    volumes:
      - appwrite_uploads:/storage/uploads
      - appwrite_cache:/storage/cache
      - appwrite_functions:/storage/functions
    depends_on:
      - appwrite
    networks:
      - wean_network

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  evolution_data:
  n8n_data:
  appwrite_uploads:
  appwrite_cache:
  appwrite_config:
  appwrite_certificates:
  appwrite_functions:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  wean_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
